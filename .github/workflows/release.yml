name: Release

# Manual only: pushing to main never triggers a release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本升级类型（major / minor / patch）"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version and build
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
          npm version "$BUMP" --no-git-tag-version >/dev/null
          TAG="v$(node -p 'require("./package.json").version')"
          SEMVER="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SEMVER=$SEMVER" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在"
            exit 1
          fi
          pnpm build

      - name: Check and test (before any tag/release)
        run: |
          pnpm check
          pnpm test

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(release): $TAG"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create and push tag
        run: |
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$PREV_TAG" <<'PY'
          import re
          import subprocess
          import sys

          prev = sys.argv[1] if len(sys.argv) > 1 else ""
          rng = f"{prev}..HEAD" if prev else "HEAD"
          raw = subprocess.check_output(["git", "log", rng, "--pretty=format:%s"], text=True)
          subjects = [x.strip() for x in raw.splitlines() if x.strip()]

          groups = [
              ("feat", "Features"),
              ("fix", "Fixes"),
              ("perf", "Performance"),
              ("refactor", "Refactor"),
              ("docs", "Docs"),
              ("test", "Tests"),
              ("build", "Build"),
              ("ci", "CI"),
              ("style", "Style"),
              ("chore", "Chores"),
          ]
          buckets = {key: [] for key, _ in groups}
          buckets["other"] = []
          for subject in subjects:
              if subject.lower().startswith("chore(release)"):
                  continue
              m = re.match(r"^(\w+)(?:\([^)]*\))?!?:\s*(.+)$", subject)
              key = m.group(1).lower() if m else "other"
              text = m.group(2) if m else subject
              buckets.setdefault(key, []).append(text)

          lines = ["## What's Changed"] + ([f"\nCompared to {prev}"] if prev else [])
          for key, title in groups:
              items = buckets.get(key, [])
              if items:
                  lines.append(f"\n### {title}")
                  lines.extend(f"- {item}" for item in items)
          if buckets.get("other"):
              lines.append("\n### Other")
              lines.extend(f"- {item}" for item in buckets["other"])
          if len(lines) == 1:
              lines.append("\nNo commits")
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

name: Release

# Manual only: pushing to main never triggers a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，格式 vX.Y.Z（例：v0.1.1）"
        required: true
        type: string
      description:
        description: "Release 说明（会作为 GitHub Release 正文）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version 必须形如 vX.Y.Z，收到：$VERSION"
            exit 1
          fi
          TAG="$VERSION"
          SEMVER="${VERSION#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SEMVER=$SEMVER" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version and build
        run: |
          npm version "$SEMVER" --no-git-tag-version --allow-same-version
          pnpm build

      - name: Check and test (before any tag/release)
        run: |
          pnpm check
          pnpm test

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(release): $TAG"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create and push tag
        run: |
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.description }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
